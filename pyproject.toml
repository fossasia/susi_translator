[project]
name = "susi-translator"
version = "0.1.0"
description = "Real-time transcription and translation prototype with Django and Flask backends."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django",
    "django-cors-headers",
    "djangorestframework",
    "drf-yasg",
    "flask",
    "flask-admin>=2.2.0",
    "flask-bcrypt>=1.0.1",
    "flask-cors",
    "flask-jwt-extended>=4.7.4",
    "flask-limiter[redis]>=4.1.1",
    "flask-migrate",
    "redis>=5.0",
    "flask-restx",
    "flask-sock>=0.7.0",
    "flask-sqlalchemy>=3.1.1",
    "huggingface-hub>=1.18.0",
    "mkdocs",
    "mkdocs-bootswatch",
    "numpy",
    "faster-whisper>=1.0.0",
    "ctranslate2>=4.0.0",
    "pyaudio",
    "pybars3",
    "pydub",
    "python-dotenv",
    "requests",
    "scipy",
    "torch",
    "transformers",
    "yt-dlp>=2024.11.4",
    "cryptography>=49.0.0",
    "pyopenssl>=24.0.0",
    "supertonic",
    "soundfile",
    "numba>=0.59.0",
    "flask-talisman>=1.1.0",
    "gunicorn>=22.0.0",
    "gevent>=24.0.0",
    "psycopg2-binary>=2.9",
   
    "nvidia-cublas-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-runtime-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cudnn-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",

]

[tool.uv]
package = false

[dependency-groups]
# Install with `uv sync --group dev` to pick up test-only deps.
dev = [
    "pytest>=7.0",
    "pytest-flask>=1.3.0",
    "locust>=2.30.0",
]

[tool.pytest.ini_options]
testpaths = ["flask/tests"]
addopts = "-ra"
